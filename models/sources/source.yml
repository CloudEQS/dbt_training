version: 2

sources:
  - name: raw
    database: "{{ 'AwsDataCatalog_prod' if target.name == 'prod' else 'AwsDataCatalog_uat' if target.name == 'uat' else 'AwsDataCatalog' }}"          
    schema:  "{{ 'dbt_training_prod' if target.name == 'prod' else 'dbt_training_uat' if target.name == 'uat' else 'dbt_training' }}"          
    loaded_at_field: SystemModstamp
    freshness:
      warn_after: {count: 24, period: hour}
      error_after: {count: 48, period: hour}

    tables:
      - name: account
      - name: patients
      - name: procedures
      - name: claims
      - name: opportunity
        description: Salesforce opportunity records — primary revenue pipeline table.
        freshness:
          warn_after: {count: 12, period: hour}
          error_after: {count: 24, period: hour}
      - name: opportunitylineitem
      - name: product
      - name: user


  - name: raw_bronze    
    database: "{{ 'AwsDataCatalog_prod' if target.name == 'prod' else 'AwsDataCatalog_uat' if target.name == 'uat' else 'AwsDataCatalog' }}"          
    schema:  "{{ 'dbt_training_prod' if target.name == 'prod' else 'dbt_training_uat' if target.name == 'uat' else 'dbt_training_bronze' }}"          

    tables:    
      - name: opportunitylineitem