version: 2

models:
  - name: sfdc_opportunity

    columns:

      # not_null and unique tests
      - name: opportunity_id
        data_tests:
          - not_null
          - unique

      # accepted_values test
      - name: stage
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - 'Qualify'
                  - '7-Closed Lost'
                  - 'Evaluate'
                  - '5-Negotiate'
                  - 'Discover'
                  - '8-QFA Disqualified'
                  - '4-Propose'
                  - '1-Discover'
                  - '2-Qualify'
                  - 'Propose'
                  - '6-Closed Won'
                  - '3-Evaluate'

      # Boolean test
      - name: is_won
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false

      # Warning severity
      - name: account_id
        data_tests:
          - not_null:
              config:
                severity: warn