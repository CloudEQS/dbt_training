version: 2

models:
  - name: sfdc_opportunity_n_stvdevs    
    columns:
      - name: amount
        data_tests:
          # anomaly detection test:(Any opportunity amount more than average value on amount column * 3 is the threshold value )  
          - dbt_expectations.expect_column_values_to_be_within_n_stdevs:
              sigma_threshold: 3